[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cci-dashboard-tickets"
version = "0.1.0"
description = "Ticket system module for the CCI dashboard"
requires-python = ">=3.12"
dependencies = ["Django>=5.2,<5.3", "Pillow>=11,<12"]
license = "MIT"

[tool.setuptools.packages.find]
include = ["dashboard_tickets*"]

[tool.setuptools.package-data]
dashboard_tickets = ["templates/*.html", "static/js/*.js", "schema/*.sql"]
